name: deploy

# Deploys only after the ci workflow succeeds for the same commit on master.
# A red commit can no longer reach production; a failed post-deploy smoke
# fails this workflow so the regression is visible immediately.
#
# Guards (review findings 2026-06-11):
# - `event == push` + same-repo head: workflow_run's `branches` filter matches
#   the HEAD branch name, so a fork PR from a branch named `master` would
#   otherwise satisfy it and deploy attacker code with production secrets.
# - tip check: two queued green runs deploy in completion order; without the
#   check the older SHA would roll back the newer one.
on:
  workflow_run:
    workflows: [ci]
    types: [completed]
    branches: [master]

concurrency:
  group: fly-production
  cancel-in-progress: false

jobs:
  fly:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success' &&
          github.event.workflow_run.event == 'push' &&
          github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0

      - name: Refuse to deploy a stale SHA
        run: |
          set -euo pipefail
          git fetch --quiet origin master
          tip=$(git rev-parse origin/master)
          if [ "$tip" != "${{ github.event.workflow_run.head_sha }}" ]; then
            echo "head_sha is no longer the tip of master ($tip); skipping deploy."
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy memory-engine-api
        run: flyctl deploy --remote-only --app memory-engine-api
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Post-deploy smoke
        run: |
          set -euo pipefail
          base="https://memory-engine-api.fly.dev"

          status=$(curl -s --max-time 15 -o /tmp/healthz -w "%{http_code}" "$base/healthz")
          test "$status" = "200"
          grep -q '"status":"ok"' /tmp/healthz

          status=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" "$base/")
          test "$status" = "200"

          # Auth boundary: anonymous study mutations must be rejected with a
          # client error, never accepted and never a server error.
          status=$(curl -s --max-time 15 -o /dev/null -w "%{http_code}" -X POST "$base/app/generate")
          case "$status" in 4??) ;; *) echo "expected 4xx, got $status"; exit 1;; esac
