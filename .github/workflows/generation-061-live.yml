name: Generation 061 trusted live comparison

on:
  workflow_dispatch:
    inputs:
      head_sha:
        description: Full commit SHA of the final card061 commit on origin/master
        required: true
        type: string
      pull_request_number:
        description: Number of the merged pull request whose squash produced head_sha
        required: true
        type: string

# This workflow is deliberately manual and trusted-branch-only. Never add a
# pull_request or pull_request_target trigger: the provisioning secret must not
# reach fork or otherwise untrusted workflow code.
permissions:
  contents: read
  checks: read
  pull-requests: read

concurrency:
  group: generation-061-live
  cancel-in-progress: false

jobs:
  compare:
    if: github.repository == 'misty-step/memory-engine' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - name: Check out the trusted default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: master
          fetch-depth: 0
          persist-credentials: false

      - name: Verify checkout has no GitHub credentials
        run: |
          set -euo pipefail
          # actions/checkout must not leave an auth extraheader in the local
          # config that Cerberus's detached worktree could share.
          if git config --get-regexp 'http\..*extraheader' >/dev/null 2>&1; then
            echo 'trusted checkout contains a GitHub auth extraheader; refusing to run' >&2
            exit 1
          fi

      - name: Validate immutable same-repository target
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
          git fetch --no-tags origin '+refs/heads/*:refs/remotes/origin/*'
          test "$(git rev-parse HEAD)" = "$(git rev-parse refs/remotes/origin/master)"
          test "$HEAD_SHA" = "$(git rev-parse refs/remotes/origin/master)"
          git cat-file -e "$HEAD_SHA^{commit}"
          git cat-file -e "$HEAD_SHA^1"
          echo "validated exact origin/master card061 target $HEAD_SHA"

      - name: Verify protected-master gates passed on the evaluated commit
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ inputs.head_sha }}
          PR_NUMBER: ${{ inputs.pull_request_number }}
        run: |
          set -euo pipefail
          # Trust anchor enforcement: the trusted helpers, proxy, and
          # validators execute from this exact origin/master commit. "It is
          # on master" is not assumed to imply the protected-branch gates
          # ran. A squash merge mints a fresh master SHA while the Cerberus
          # `review` check runs on the reviewed PR head — and a
          # workflow_dispatch of the review workflow against master could
          # plant a green `review` on master while reviewing an unrelated
          # diff. Bind the evaluated commit to the exact merged pull
          # request instead: the PR must be merged, its squash commit must
          # be exactly HEAD_SHA, the reviewed PR head tree must equal the
          # HEAD_SHA tree (protected master requires up-to-date branches
          # and linear history, so a faithful squash preserves the tree),
          # `review` must have succeeded on that exact PR head, and `ci`
          # must have succeeded on HEAD_SHA itself. Every mismatch fails
          # closed before any provider authority exists.
          [[ "$PR_NUMBER" =~ ^[0-9]+$ ]]
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}")"
          merged="$(jq -r '.merged' <<<"$pr")"
          merge_commit_sha="$(jq -r '.merge_commit_sha' <<<"$pr")"
          base_repo="$(jq -r '.base.repo.full_name' <<<"$pr")"
          base_ref="$(jq -r '.base.ref' <<<"$pr")"
          pr_head_sha="$(jq -r '.head.sha' <<<"$pr")"
          test "$merged" = true
          test "$base_repo" = "$GITHUB_REPOSITORY"
          test "$base_ref" = master
          test "$merge_commit_sha" = "$HEAD_SHA"
          [[ "$pr_head_sha" =~ ^[0-9a-f]{40}$ ]]
          head_tree="$(gh api "repos/${GITHUB_REPOSITORY}/git/commits/${pr_head_sha}" --jq '.tree.sha')"
          master_tree="$(git rev-parse "${HEAD_SHA}^{tree}")"
          [[ "$head_tree" =~ ^[0-9a-f]{40}$ ]]
          test "$head_tree" = "$master_tree"
          review_successes="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${pr_head_sha}/check-runs?check_name=review&per_page=100" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [[ "$review_successes" -lt 1 ]]; then
            echo "Cerberus review has no successful check run on the merged PR head ${pr_head_sha}; refusing to expose provider authority" >&2
            exit 1
          fi
          ci_successes="$(gh api \
            "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?check_name=ci&per_page=100" \
            --jq '[.check_runs[] | select(.conclusion == "success")] | length')"
          if [[ "$ci_successes" -lt 1 ]]; then
            echo "required protected-branch gate ci has no successful check run on ${HEAD_SHA}; refusing to expose provider authority" >&2
            exit 1
          fi
          # Pin the trusted-file set for the run log: reviewers can compare
          # these digests against the evaluated commit.
          sha256sum \
            scripts/generation-061-live-comparison.sh \
            scripts/generation-061-trusted-provider-proxy.py \
            scripts/generation-061-copy-regular.py \
            scripts/generation-061-stage-evidence.sh \
            scripts/generation-061-scan-safe.sh \
            scripts/generation-061-validate-receipt.sh \
            scripts/generation-061-validate-provider-attestation.sh \
            scripts/generation-061-audit-command-files.sh \
            scripts/generation-061-cerberus-key.sh

      - name: Install Rust
        uses: dtolnay/rust-toolchain@fa04a1451ff1842e2626ccb99004d0195b455a88 # reviewed stable action commit

      - name: Install pinned Cerberus
        # Cerberus must remain a reviewed immutable dependency of this lane.
        run: cargo install --locked --git https://github.com/misty-step/cerberus.git --rev b10bffb6ddb14ec553fbcf4f5e687aee13424717 --bin cerberus

      - name: Prepare non-secret runtime environment
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          cargo_bin="$(command -v cargo)"
          cargo_home="${CARGO_HOME:-$HOME/.cargo}"
          rustup_home="${RUSTUP_HOME:-$HOME/.rustup}"
          cache_dir="$RUNNER_TEMP/generation-061-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_name="memory-engine-061-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          container_label="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          {
            printf 'CARGO_HOME=%s\n' "$cargo_home"
            printf 'RUSTUP_HOME=%s\n' "$rustup_home"
            printf 'GENERATION_HEAD_SHA=%s\n' "$HEAD_SHA"
            printf 'GENERATION_CACHE_DIR=%s\n' "$cache_dir"
            printf 'GENERATION_CONTAINER_NAME=%s\n' "$container_name"
            printf 'GENERATION_CONTAINER_LABEL=%s\n' "$container_label"
            printf 'GENERATION_BUILD_TIMEOUT_SECONDS=%s\n' '1200'
            printf 'GENERATION_CONTAINER_TIMEOUT_SECONDS=%s\n' '1800'
            printf 'GENERATION_CONTAINER_IMAGE=%s\n' 'rust:1.88-bookworm@sha256:4727898c104ecd2e22d780925832502faee9fe4e70581b8572af081370b315a0'
            printf 'GENERATION_RUNTIME_IMAGE=%s\n' 'debian:bookworm-slim@sha256:7b140f374b289a7c2befc338f42ebe6441b7ea838a042bbd5acbfca6ec875818'
            printf 'GENERATION_TRUSTED_HELPER=%s\n' "$GITHUB_WORKSPACE/scripts/generation-061-live-comparison.sh"
            printf 'GENERATION_TRUSTED_VALIDATOR=%s\n' "$GITHUB_WORKSPACE/scripts/generation-061-validate-receipt.sh"
            printf 'GENERATION_TRUSTED_PROXY=%s\n' "$GITHUB_WORKSPACE/scripts/generation-061-trusted-provider-proxy.py"
            printf 'GENERATION_PROVIDER_ATTESTATION=%s\n' "$cache_dir/provider-attestation.json"
            printf 'GENERATION_TRUSTED_ATTESTATION_VALIDATOR=%s\n' "$GITHUB_WORKSPACE/scripts/generation-061-validate-provider-attestation.sh"
            printf 'GENERATION_RUNTIME_CLEANUP_EVIDENCE=%s\n' "$cache_dir/runtime-cleanup.json"
          } >> "$GITHUB_ENV"
          test -x "$cargo_bin"

      - name: Build the exact live-generation request
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          mkdir -p target/generation-061-live
          base_sha="$(git rev-parse "$HEAD_SHA^1")"
          test "$base_sha" != "$HEAD_SHA"
          # A distinct parent SHA is not enough: an empty commit on master
          # would produce an empty evaluation range. Require the trees to
          # actually differ.
          if git diff --quiet "$base_sha" "$HEAD_SHA"; then
            echo 'evaluated commit has an empty tree diff against its parent; refusing live evaluation' >&2
            exit 1
          fi
          cerberus request git-range \
            --repo-path . \
            --base "$base_sha" \
            --head "$HEAD_SHA" \
            --local-runtime-command "$GITHUB_WORKSPACE/scripts/generation-061-live-comparison.sh" \
            --allow-local-runtime \
            --allow-env GENERATION_PROVIDER_KEY \
            --allow-env CARGO_HOME \
            --allow-env RUSTUP_HOME \
            --allow-env GENERATION_HEAD_SHA \
            --allow-env GENERATION_CONTAINER_IMAGE \
            --allow-env GENERATION_RUNTIME_IMAGE \
            --allow-env GENERATION_CONTAINER_LABEL \
            --allow-env GENERATION_CACHE_DIR \
            --allow-env GENERATION_TRUSTED_HELPER \
            --allow-env GENERATION_TRUSTED_VALIDATOR \
            --allow-env GENERATION_TRUSTED_PROXY \
            --allow-env GENERATION_PROVIDER_ATTESTATION \
            --allow-env GENERATION_TRUSTED_ATTESTATION_VALIDATOR \
            --allow-env GENERATION_CONTAINER_NAME \
            --allow-env GENERATION_BUILD_TIMEOUT_SECONDS \
            --allow-env GENERATION_CONTAINER_TIMEOUT_SECONDS \
            --allow-env GENERATION_RUNTIME_CLEANUP_EVIDENCE \
            --out target/generation-061-live/request.json

      - name: Pin the Cerberus fixture substrate
        run: |
          set -euo pipefail
          git clone --quiet --no-tags https://github.com/misty-step/cerberus.git target/cerberus-source
          git -C target/cerberus-source fetch --quiet --depth 1 origin b10bffb6ddb14ec553fbcf4f5e687aee13424717
          git -C target/cerberus-source checkout --quiet b10bffb6ddb14ec553fbcf4f5e687aee13424717
          printf 'CERBERUS_SOURCE_DIR=%s\n' "$GITHUB_WORKSPACE/target/cerberus-source" >> "$GITHUB_ENV"

      - name: Mint bounded key in short-lived process
        id: mint_key
        env:
          CERBERUS_OPENROUTER_PROVISIONING_KEY: ${{ secrets.CERBERUS_OPENROUTER_PROVISIONING_KEY }}
        run: |
          set -euo pipefail
          command_file_dir="$RUNNER_TEMP/generation-061-command-files"
          mkdir -p "$command_file_dir"
          capture_command_files() {
            for name in GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH; do
              file="${!name:-}"
              [[ -n "$file" && -f "$file" ]] && cp -- "$file" "$command_file_dir/mint-${name#GITHUB_}"
            done
          }
          source scripts/generation-061-audit-command-files.sh
          audit_mint_command_files() {
            capture_command_files
            audit_generation_command_files "$GITHUB_ENV" "$GITHUB_OUTPUT" "$GITHUB_PATH"
          }
          trap audit_mint_command_files EXIT INT TERM
          if [[ -z "$CERBERUS_OPENROUTER_PROVISIONING_KEY" ]]; then
            echo 'CERBERUS_OPENROUTER_PROVISIONING_KEY is required; refusing to run live generation' >&2
            exit 1
          fi
          state_dir="$RUNNER_TEMP/generation-061-live-key-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          umask 077
          mkdir -p "$state_dir"
          {
            printf 'SCOPED_KEY_STATE_DIR=%s\n' "$state_dir"
            printf 'SCOPED_KEY_FILE=%s/scoped-key\n' "$state_dir"
            printf 'SCOPED_KEY_HASH_FILE=%s/scoped-hash\n' "$state_dir"
            printf 'CERBERUS_KEY_TAG=generation-061-live-%s-%s\n' "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT"
          } >> "$GITHUB_ENV"
          scripts/generation-061-cerberus-key.sh mint "$state_dir" "generation-061-live-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          test -s "$state_dir/scoped-key"
          test -s "$state_dir/scoped-hash"

      - name: Run exact benchmark with scoped key only
        id: run_benchmark
        run: |
          set -euo pipefail
          command_file_dir="$RUNNER_TEMP/generation-061-command-files"
          mkdir -p "$command_file_dir"
          capture_command_files() {
            for name in GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH; do
              file="${!name:-}"
              [[ -n "$file" && -f "$file" ]] && cp -- "$file" "$command_file_dir/benchmark-${name#GITHUB_}"
            done
          }
          source scripts/generation-061-audit-command-files.sh
          audit_benchmark_command_files() {
            capture_command_files
            audit_generation_command_files "$GITHUB_ENV" "$GITHUB_OUTPUT" "$GITHUB_PATH"
          }
          trap audit_benchmark_command_files EXIT INT TERM
          test -s "$SCOPED_KEY_FILE"
          scoped_key="$(< "$SCOPED_KEY_FILE")"
          rm -f -- "$SCOPED_KEY_FILE"
          # env -i prevents GITHUB_TOKEN, command-file paths, provisioning
          # authority, and unrelated runner variables from entering Cerberus.
          # The trusted outer helper receives only the bounded provider key;
          # the target receives a one-run local proxy capability and no key.
          env -i \
            PATH="$PATH" \
            HOME="$HOME" \
            CARGO_HOME="$CARGO_HOME" \
            RUSTUP_HOME="$RUSTUP_HOME" \
            GENERATION_PROVIDER_KEY="$scoped_key" \
            GENERATION_HEAD_SHA="$GENERATION_HEAD_SHA" \
            GENERATION_CONTAINER_IMAGE="$GENERATION_CONTAINER_IMAGE" \
            GENERATION_RUNTIME_IMAGE="$GENERATION_RUNTIME_IMAGE" \
            GENERATION_CONTAINER_LABEL="$GENERATION_CONTAINER_LABEL" \
            GENERATION_CACHE_DIR="$GENERATION_CACHE_DIR" \
            GENERATION_TRUSTED_HELPER="$GENERATION_TRUSTED_HELPER" \
            GENERATION_TRUSTED_VALIDATOR="$GENERATION_TRUSTED_VALIDATOR" \
            GENERATION_TRUSTED_PROXY="$GENERATION_TRUSTED_PROXY" \
            GENERATION_PROVIDER_ATTESTATION="$GENERATION_PROVIDER_ATTESTATION" \
            GENERATION_TRUSTED_ATTESTATION_VALIDATOR="$GENERATION_TRUSTED_ATTESTATION_VALIDATOR" \
            GENERATION_CONTAINER_NAME="$GENERATION_CONTAINER_NAME" \
            GENERATION_BUILD_TIMEOUT_SECONDS="$GENERATION_BUILD_TIMEOUT_SECONDS" \
            GENERATION_CONTAINER_TIMEOUT_SECONDS="$GENERATION_CONTAINER_TIMEOUT_SECONDS" \
            GENERATION_RUNTIME_CLEANUP_EVIDENCE="$GENERATION_RUNTIME_CLEANUP_EVIDENCE" \
            cerberus review \
              --request target/generation-061-live/request.json \
              --harness fixture \
              --fixture-output target/cerberus-source/fixtures/harness/valid-review.txt \
              --out target/generation-061-live/artifact.json \
              --transcript target/generation-061-live/transcript.txt \
              --receipt-bundle target/generation-061-live/cerberus-receipt.json \
              --timeout-seconds 1800
          unset scoped_key GENERATION_PROVIDER_KEY || true

      - name: Stop every disposable target container before staging
        id: stop_target
        if: always()
        run: |
          set -euo pipefail
          docker_bin="$(command -v docker)"
          if [[ -z "${GENERATION_CONTAINER_LABEL:-}" ]]; then
            printf 'stopped=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # Every docker command failure fails closed: a daemon error while
          # a labeled container is possibly alive must never be read as
          # "everything stopped".
          set +e
          containers="$("$docker_bin" container ls -aq --filter "label=memory-engine.generation-061=${GENERATION_CONTAINER_LABEL}")"
          listing_status=$?
          set -e
          if [[ "$listing_status" -ne 0 ]]; then
            echo 'docker could not enumerate labeled target containers; refusing trusted staging' >&2
            exit 1
          fi
          for container in $containers; do
            "$docker_bin" container rm -f "$container"
          done
          set +e
          remaining="$("$docker_bin" container ls -aq --filter "label=memory-engine.generation-061=${GENERATION_CONTAINER_LABEL}")"
          remaining_status=$?
          set -e
          if [[ "$remaining_status" -ne 0 || -n "$remaining" ]]; then
            echo 'a target container remained alive or docker failed; refusing trusted staging' >&2
            exit 1
          fi
          printf 'stopped=true\n' >> "$GITHUB_OUTPUT"

      - name: Revoke scoped key (always)
        id: revoke_key
        if: always()
        env:
          CERBERUS_OPENROUTER_PROVISIONING_KEY: ${{ secrets.CERBERUS_OPENROUTER_PROVISIONING_KEY }}
        run: |
          set -euo pipefail
          command_file_dir="$RUNNER_TEMP/generation-061-command-files"
          mkdir -p "$command_file_dir"
          capture_command_files() {
            for name in GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH; do
              file="${!name:-}"
              [[ -n "$file" && -f "$file" ]] && cp -- "$file" "$command_file_dir/revoke-${name#GITHUB_}"
            done
          }
          hash_file="${SCOPED_KEY_HASH_FILE:-}"
          cleanup_key_state() {
            rm -f -- "${SCOPED_KEY_FILE:-}" "${SCOPED_KEY_HASH_FILE:-}"
            if [[ -n "${SCOPED_KEY_STATE_DIR:-}" ]]; then
              rmdir --ignore-fail-on-non-empty -- "$SCOPED_KEY_STATE_DIR" 2>/dev/null || true
            fi
          }
          source scripts/generation-061-audit-command-files.sh
          audit_revoke_command_files() {
            cleanup_key_state
            capture_command_files
            audit_generation_command_files "$GITHUB_ENV" "$GITHUB_OUTPUT" "$GITHUB_PATH"
          }
          trap audit_revoke_command_files EXIT INT TERM
          if [[ -z "$hash_file" || ! -s "$hash_file" ]]; then
            printf 'revoked=true\n' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -z "${CERBERUS_OPENROUTER_PROVISIONING_KEY:-}" ]]; then
            echo 'the scoped key exists but provisioning authority is missing; refusing to claim cleanup' >&2
            exit 1
          fi
          scripts/generation-061-cerberus-key.sh revoke "$SCOPED_KEY_STATE_DIR" "${CERBERUS_KEY_TAG:-generation-061-live}"
          printf 'revoked=true\n' >> "$GITHUB_OUTPUT"

      - name: Audit pre-publish command files and runner state
        id: audit_transport_pre_publish
        if: always()
        run: |
          set -euo pipefail
          cleanup_sensitive_state() {
            rm -f -- "${SCOPED_KEY_FILE:-}" "${SCOPED_KEY_HASH_FILE:-}"
            if [[ -n "${SCOPED_KEY_STATE_DIR:-}" ]]; then
              rmdir --ignore-fail-on-non-empty -- "$SCOPED_KEY_STATE_DIR" 2>/dev/null || true
            fi
            if [[ -n "${GENERATION_CACHE_DIR:-}" && -d "$GENERATION_CACHE_DIR" ]]; then
              find "$GENERATION_CACHE_DIR" -type f -name 'container-env.*' -delete
            fi
          }
          source scripts/generation-061-audit-command-files.sh
          trap cleanup_sensitive_state EXIT INT TERM
          command_files=("$GITHUB_ENV" "$GITHUB_OUTPUT" "$GITHUB_PATH")
          if [[ -d "$RUNNER_TEMP/generation-061-command-files" ]]; then
            while IFS= read -r -d '' command_file; do
              command_files+=("$command_file")
            done < <(find "$RUNNER_TEMP/generation-061-command-files" -type f -print0)
          fi
          audit_generation_command_files "${command_files[@]}"
          if [[ -n "${SCOPED_KEY_FILE:-}" && -e "$SCOPED_KEY_FILE" ]]; then
            echo 'scoped key state remained after target cleanup' >&2
            exit 1
          fi
          if [[ -n "${SCOPED_KEY_HASH_FILE:-}" && -e "$SCOPED_KEY_HASH_FILE" ]]; then
            echo 'scoped key hash state remained after revocation' >&2
            exit 1
          fi
          if [[ -n "${GENERATION_CACHE_DIR:-}" ]] && find "$GENERATION_CACHE_DIR" -type f -name 'container-env.*' -print -quit | grep -q .; then
            echo 'container environment file remained after target cleanup' >&2
            exit 1
          fi
          printf 'clean=true\n' >> "$GITHUB_OUTPUT"

      - name: Publish a dated redacted eval receipt
        id: publish_receipt
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
        run: |
          set -euo pipefail
          command_file_dir="$RUNNER_TEMP/generation-061-command-files"
          mkdir -p "$command_file_dir"
          capture_command_files() {
            for name in GITHUB_ENV GITHUB_OUTPUT GITHUB_PATH; do
              file="${!name:-}"
              [[ -n "$file" && -f "$file" ]] && cp -- "$file" "$command_file_dir/publish-${name#GITHUB_}"
            done
          }
          source scripts/generation-061-audit-command-files.sh
          audit_publish_command_files() {
            capture_command_files
            audit_generation_command_files "$GITHUB_ENV" "$GITHUB_OUTPUT" "$GITHUB_PATH"
          }
          trap audit_publish_command_files EXIT INT TERM
          date_utc="$(date -u +%F)"
          published_dir="$GENERATION_CACHE_DIR/published"
          mkdir -p -- "$published_dir"
          receipt="$published_dir/generation-061-live-comparison-${date_utc}.md"
          raw_receipt="$RUNNER_TEMP/generation-061-live-receipt.md"
          scripts/generation-061-validate-provider-attestation.sh "$GENERATION_PROVIDER_ATTESTATION" "$HEAD_SHA"
          sed -n '/^--- GENERATION_061_RECEIPT_BEGIN ---/,/^--- GENERATION_061_RECEIPT_END ---/ {
            /^--- GENERATION_061_RECEIPT_/d
            p
          }' target/generation-061-live/transcript.txt > "$raw_receipt"
          # Published fields are size-capped trusted material; an oversized
          # extraction can only be smuggled bulk content.
          test "$(wc -c < "$raw_receipt")" -le 262144
          scripts/generation-061-validate-receipt.sh "$raw_receipt"
          scan_no_credentials() {
            set +e
            rg -n --hidden -F \
              -e 'CERBERUS_OPENROUTER_PROVISIONING_KEY' \
              -e 'GENERATION_PROVIDER_KEY=' \
              -e 'OPENROUTER_PROXY_TOKEN=' \
              -e 'OPENROUTER_API_KEY=' \
              -e 'sk-or-v1-' \
              -- "$@" >/dev/null 2>&1
            status=$?
            set -e
            case "$status" in
              0) echo 'credential-shaped bytes found in receipt/transcript' >&2; return 1 ;;
              1) return 0 ;;
              *) echo "credential scanner failed (rg exit $status)" >&2; return 1 ;;
            esac
          }
          command -v rg >/dev/null 2>&1 || { echo 'credential scanner rg is missing' >&2; exit 1; }
          scan_no_credentials "$raw_receipt" target/generation-061-live/transcript.txt
          {
            printf '# Generation 061 trusted live comparison receipt — %s\n\n' "$date_utc"
            printf 'Immutable evaluated head: %s\n\n' "$HEAD_SHA"
            printf 'Provider: OpenRouter through a trusted local proxy; maximum spend cap: USD 2. Provider credentials were not passed to the benchmark subprocess.\n\n'
            cat "$raw_receipt"
          } > "$receipt"
          rm -f -- "$raw_receipt"
          test -s "$receipt"
          printf 'receipt_path=%s\n' "$receipt" >> "$GITHUB_OUTPUT"

      - name: Final audit command files and runner state before staging
        id: audit_transport
        if: always()
        run: |
          set -euo pipefail
          cleanup_sensitive_state() {
            rm -f -- "${SCOPED_KEY_FILE:-}" "${SCOPED_KEY_HASH_FILE:-}"
            if [[ -n "${SCOPED_KEY_STATE_DIR:-}" ]]; then
              rmdir --ignore-fail-on-non-empty -- "$SCOPED_KEY_STATE_DIR" 2>/dev/null || true
            fi
            if [[ -n "${GENERATION_CACHE_DIR:-}" && -d "$GENERATION_CACHE_DIR" ]]; then
              find "$GENERATION_CACHE_DIR" -type f -name 'container-env.*' -delete
            fi
            rm -rf -- "${RUNNER_TEMP:-}/generation-061-command-files"
          }
          source scripts/generation-061-audit-command-files.sh
          trap cleanup_sensitive_state EXIT INT TERM
          command_files=("$GITHUB_ENV" "$GITHUB_OUTPUT" "$GITHUB_PATH")
          if [[ -d "$RUNNER_TEMP/generation-061-command-files" ]]; then
            while IFS= read -r -d '' command_file; do
              command_files+=("$command_file")
            done < <(find "$RUNNER_TEMP/generation-061-command-files" -type f -print0)
          fi
          audit_generation_command_files "${command_files[@]}"
          if [[ -n "${SCOPED_KEY_FILE:-}" && -e "$SCOPED_KEY_FILE" ]]; then
            echo 'scoped key state remained after target cleanup' >&2
            exit 1
          fi
          if [[ -n "${SCOPED_KEY_HASH_FILE:-}" && -e "$SCOPED_KEY_HASH_FILE" ]]; then
            echo 'scoped key hash state remained after revocation' >&2
            exit 1
          fi
          if [[ -n "${GENERATION_CACHE_DIR:-}" ]] && find "$GENERATION_CACHE_DIR" -type f -name 'container-env.*' -print -quit | grep -q .; then
            echo 'container environment file remained after target cleanup' >&2
            exit 1
          fi
          printf 'clean=true\n' >> "$GITHUB_OUTPUT"

      - name: Stage only scanned live evidence
        id: sanitize_evidence
        if: always() && steps.run_benchmark.outcome == 'success' && steps.publish_receipt.outcome == 'success' && steps.stop_target.outputs.stopped == 'true' && steps.revoke_key.outputs.revoked == 'true' && steps.audit_transport.outputs.clean == 'true'
        env:
          HEAD_SHA: ${{ inputs.head_sha }}
          RECEIPT_PATH: ${{ steps.publish_receipt.outputs.receipt_path }}
        run: |
          set -euo pipefail
          candidates="target/generation-061-live-candidates"
          rm -rf -- "$candidates"
          mkdir -p "$candidates"
          # Published evidence is only trusted schema-validated size-capped
          # fields: the proxy's attestation, the wrapper's cleanup proof,
          # and the validated dated receipt. The raw target transcript and
          # harness bundles never leave the runner.
          scripts/generation-061-stage-evidence.sh "$candidates" \
            "$GENERATION_PROVIDER_ATTESTATION" \
            "$GENERATION_RUNTIME_CLEANUP_EVIDENCE"
          test -n "$RECEIPT_PATH"
          scripts/generation-061-stage-evidence.sh "$candidates" "$RECEIPT_PATH"
          jq -e --arg expected_head "$HEAD_SHA" ".schema == \"memory-engine/generation-061-runtime-cleanup/v1\" and .target_sha == \$expected_head and .build_timed_out == false and .runtime_timed_out == false and .container_removed == true and .output_host_mount == false and .prepared_removed == true and .provider_proxy_stopped == true and .attestation_validated == true" "$GENERATION_RUNTIME_CLEANUP_EVIDENCE" >/dev/null
          test -s "$candidates/provider-attestation.json"
          test -s "$candidates/runtime-cleanup.json"
          test -s "$candidates/$(basename "$RECEIPT_PATH")"
          scripts/generation-061-scan-safe.sh "$candidates" target/generation-061-live-safe
          printf 'safe=true\n' >> "$GITHUB_OUTPUT"

      - name: Recheck safe package immediately before upload
        id: package
        if: always() && steps.sanitize_evidence.outputs.safe == 'true'
        run: |
          set -euo pipefail
          safe_dir="target/generation-061-live-safe"
          (cd "$safe_dir" && sha256sum -c SHA256SUMS)
          if ! rg_bin="$(command -v rg)"; then
            echo 'credential scanner rg is missing; refusing upload' >&2
            exit 1
          fi
          for path in "$safe_dir"/*; do
            [[ "$(basename "$path")" == SHA256SUMS ]] && continue
            set +e
            "$rg_bin" -n --hidden -F \
              -e 'CERBERUS_OPENROUTER_PROVISIONING_KEY' \
              -e 'GENERATION_PROVIDER_KEY=' \
              -e 'OPENROUTER_PROXY_TOKEN=' \
              -e 'OPENROUTER_API_KEY=' \
              -e 'sk-or-v1-' \
              -- "$path" >/dev/null 2>&1
            status=$?
            set -e
            case "$status" in
              0) echo 'safe package changed to contain credential-shaped bytes' >&2; exit 1 ;;
              1) ;;
              *) echo "credential scanner failed before upload (rg exit $status)" >&2; exit 1 ;;
            esac
          done
          printf 'verified=true\n' >> "$GITHUB_OUTPUT"

      - name: Upload dated live evidence
        if: always() && steps.package.outputs.verified == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: generation-061-live-${{ inputs.head_sha }}
          path: |
            target/generation-061-live-safe/**
          if-no-files-found: error
          retention-days: 14
