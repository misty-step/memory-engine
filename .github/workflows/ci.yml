name: ci

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@v2

      - name: Install Dagger
        run: |
          curl -fsSL https://dl.dagger.io/dagger/install.sh | BIN_DIR=$HOME/.local/bin sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Run full repo CI gate
        run: bun run ci:full

      - name: Export Postgres action latency receipt
        run: |
          mkdir -p "target/perf/action-latency-postgres-${GITHUB_SHA}"
          dagger call action-latency-postgres --source=. --git-sha="$GITHUB_SHA" export --path="target/perf/action-latency-postgres-${GITHUB_SHA}"

      - name: Upload Postgres action latency receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: action-latency-postgres-${{ github.sha }}
          path: target/perf/action-latency-postgres-${{ github.sha }}
          retention-days: 14
