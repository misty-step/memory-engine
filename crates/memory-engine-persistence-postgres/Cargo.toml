[package]
name = "memory-engine-persistence-postgres"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Postgres production persistence adapter for account-scoped memory-engine study state."

[dependencies]
memory-engine-core = { path = "../memory-engine-core" }
memory-engine-generation = { path = "../memory-engine-generation" }
memory-engine-persistence = { path = "../memory-engine-persistence" }
memory-engine-service = { path = "../memory-engine-service" }
memory-engine-study = { path = "../memory-engine-study" }
postgres = { version = "0.19.12", features = ["with-serde_json-1"] }
r2d2 = "0.8"
rustls = { version = "0.23", features = ["ring"] }
tokio-postgres-rustls = "0.13"
webpki-roots = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"

[lints]
workspace = true
