[package]
name = "memory-engine-api"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Production HTTP API boundary for the memory-engine mobile study app."

[dependencies]
axum = "0.8.7"
memory-engine-api-render = { path = "../memory-engine-api-render" }
memory-engine-api-state = { path = "../memory-engine-api-state" }
memory-engine-study = { path = "../memory-engine-study" }
memory-engine-service = { path = "../memory-engine-service" }
rand = "0.9.3"
serde = { version = "1.0.228", features = ["derive"] }
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.18", features = ["sync"] }

[dev-dependencies]
memory-engine-core = { path = "../memory-engine-core" }
memory-engine-persistence = { path = "../memory-engine-persistence" }
memory-engine-persistence-postgres = { path = "../memory-engine-persistence-postgres" }
serde_json = "1.0.145"
postgres = "0.19.13"
tower = { version = "0.5.2", features = ["util"] }

[lints]
workspace = true
