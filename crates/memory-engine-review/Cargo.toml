[package]
name = "memory-engine-review"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Morning-review dogfood CLI client for the deployed memory-engine-api."

[dependencies]
memory-engine-credentials = { path = "../memory-engine-credentials" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ureq = { version = "3.2.0", features = ["json"] }

[dev-dependencies]
axum = "0.8.7"
memory-engine-api = { path = "../memory-engine-api" }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
