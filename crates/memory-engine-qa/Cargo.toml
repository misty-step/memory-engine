[package]
name = "memory-engine-qa"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Rust QA lane runner for memory-engine."

[dependencies]
axum = "0.8.7"
memory-engine-api = { path = "../memory-engine-api" }
memory-engine-performance = { path = "../memory-engine-performance" }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["rt-multi-thread", "time"] }
tower = { version = "0.5.2", features = ["util"] }

[dev-dependencies]
serde_yaml = "0.9.34"

[lints]
workspace = true
