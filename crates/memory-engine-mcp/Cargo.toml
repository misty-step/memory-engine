[package]
name = "memory-engine-mcp"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "Stdio MCP server wrapping the deployed memory-engine-api study/review contract for agent-driven review loops."

[lib]
path = "src/lib.rs"

[[bin]]
name = "memory-engine-mcp"
path = "src/main.rs"

[dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
ureq = { version = "3.2.0", features = ["json"] }

[dev-dependencies]
axum = "0.8.7"
memory-engine-api = { path = "../memory-engine-api" }
tokio = { version = "1.48.0", features = ["macros", "net", "rt-multi-thread"] }

[lints]
workspace = true
