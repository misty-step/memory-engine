[package]
name = "memory-engine-api-state"
edition.workspace = true
license.workspace = true
version.workspace = true
description = "State, auth, storage, and job adapters for the Memory Engine HTTP API."

[dependencies]
axum = "0.8.7"
memory-engine-canary = { path = "../memory-engine-canary" }
memory-engine-generation = { path = "../memory-engine-generation" }
memory-engine-openrouter = { path = "../memory-engine-openrouter" }
memory-engine-persistence = { path = "../memory-engine-persistence" }
memory-engine-persistence-postgres = { path = "../memory-engine-persistence-postgres" }
memory-engine-service = { path = "../memory-engine-service" }
memory-engine-study = { path = "../memory-engine-study" }
rand = "0.9.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sha2 = "0.11.0"
tokio = { version = "1.48.0", features = ["macros", "rt-multi-thread", "sync", "time"] }

[dev-dependencies]
memory-engine-core = { path = "../memory-engine-core" }

[lints]
workspace = true
