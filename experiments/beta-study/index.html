<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Engine Beta Study</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f7f8f4;
        color: #20241f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f7f8f4;
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) minmax(280px, 360px);
      }

      .study {
        min-width: 0;
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        padding: 24px;
      }

      header,
      .actions {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
      }

      header {
        border-bottom: 1px solid #d9ded5;
        padding-bottom: 16px;
        color: #586257;
        font-size: 14px;
      }

      .prompt {
        width: min(100%, 760px);
        align-self: center;
        padding: 28px 0;
      }

      h1 {
        margin: 0 0 18px;
        font-size: 34px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .kind {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-bottom: 16px;
      }

      .kind span {
        border: 1px solid #b9c4b5;
        border-radius: 6px;
        padding: 5px 8px;
        background: #ffffff;
        color: #485348;
        font-size: 13px;
        font-weight: 650;
      }

      label {
        display: block;
        margin-bottom: 8px;
        color: #586257;
        font-size: 14px;
        font-weight: 650;
      }

      textarea {
        width: 100%;
        min-height: 116px;
        resize: vertical;
        border: 1px solid #b9c4b5;
        border-radius: 6px;
        padding: 12px 14px;
        background: #ffffff;
        color: #20241f;
        font: inherit;
        line-height: 1.45;
      }

      button {
        min-height: 40px;
        border: 1px solid #24533d;
        border-radius: 6px;
        padding: 0 14px;
        background: #24533d;
        color: #ffffff;
        font: inherit;
        font-weight: 700;
        cursor: pointer;
      }

      button.secondary {
        background: #ffffff;
        color: #24533d;
      }

      .actions {
        justify-content: flex-start;
        flex-wrap: wrap;
        padding-top: 16px;
      }

      .answer,
      .grade,
      .solution {
        margin-top: 12px;
        min-height: 24px;
        overflow-wrap: anywhere;
        font-size: 15px;
        font-weight: 650;
      }

      .answer {
        color: #24533d;
      }

      .grade {
        color: #7a4322;
      }

      .solution {
        color: #455048;
        font-weight: 500;
      }

      aside {
        min-width: 0;
        border-left: 1px solid #d9ded5;
        background: #ffffff;
      }

      section.panel {
        border-bottom: 1px solid #d9ded5;
        padding: 20px;
      }

      h2 {
        margin: 0 0 14px;
        font-size: 15px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 9px 14px;
        margin: 0;
        color: #586257;
        font-size: 14px;
      }

      dd {
        margin: 0;
        color: #20241f;
        font-weight: 700;
      }

      ol,
      ul {
        display: grid;
        gap: 9px;
        margin: 0;
        padding-left: 18px;
        color: #586257;
        font-size: 14px;
      }

      li strong {
        display: block;
        color: #20241f;
        overflow-wrap: anywhere;
      }

      .composer {
        display: grid;
        gap: 10px;
        border-top: 1px solid #d9ded5;
        padding-top: 16px;
      }

      input {
        width: 100%;
        min-height: 38px;
        border: 1px solid #b9c4b5;
        border-radius: 6px;
        padding: 0 10px;
        font: inherit;
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }

        .study {
          display: block;
          min-height: auto;
          padding: 18px;
        }

        h1 {
          font-size: 28px;
        }

        aside {
          border-left: 0;
          border-top: 1px solid #d9ded5;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="study">
        <header>
          <strong>Beta Study</strong>
          <span id="status">loading</span>
        </header>
        <div class="prompt">
          <div class="kind">
            <span id="activity">activity</span>
            <span id="stage">stage</span>
          </div>
          <h1 id="prompt">Add source material to begin.</h1>
          <label for="answer">Answer or worked solution</label>
          <textarea id="answer" autocomplete="off" spellcheck="false"></textarea>
          <div class="answer" id="expected"></div>
          <div class="solution" id="solution"></div>
          <div class="grade" id="grade"></div>
          <div class="actions">
            <button type="button" id="submit">Submit</button>
            <button type="button" class="secondary" id="reveal">Reveal</button>
            <button type="button" class="secondary" id="next">Next</button>
          </div>
        </div>
        <form class="composer" id="source-form">
          <label for="source-title">Source title</label>
          <input id="source-title" value="NATO practice notes" />
          <label for="source-body">Source blocks</label>
          <textarea id="source-body"></textarea>
          <div class="actions">
            <button type="submit">Save Source</button>
            <button type="button" class="secondary" id="generate">Generate</button>
          </div>
        </form>
      </section>
      <aside>
        <section class="panel">
          <h2>Review State</h2>
          <dl>
            <dt>Reps</dt>
            <dd id="reps">0</dd>
            <dt>State</dt>
            <dd id="state">new</dd>
            <dt>Attempts</dt>
            <dd id="attempts">0</dd>
            <dt>Outcome</dt>
            <dd id="outcome">none</dd>
          </dl>
        </section>
        <section class="panel">
          <h2>Drafts</h2>
          <ul id="drafts"></ul>
        </section>
        <section class="panel">
          <h2>Queue</h2>
          <ol id="queue"></ol>
        </section>
      </aside>
    </main>
    <script>
      const fixture = [
        "Concept: NATO letter A",
        "Activity: quiz",
        "Stage: recognition-3",
        "Question: What is the NATO phonetic alphabet word for A?",
        "Answer: ALFA",
        "Distractors: BRAVO, CHARLIE",
        "Reference: The NATO phonetic alphabet word for A is ALFA.",
        "",
        "Concept: NATO CAT composition",
        "Activity: exercise",
        "Stage: composition",
        "Question: Spell CAT over the phone using the NATO phonetic alphabet.",
        "Answer: CHARLIE ALFA TANGO",
        "Worked Solution: C is CHARLIE, A is ALFA, and T is TANGO.",
        "Reference: C is CHARLIE. A is ALFA. T is TANGO.",
      ].join("\n");

      const sourceBody = document.querySelector("#source-body");
      const answer = document.querySelector("#answer");
      sourceBody.value = fixture;

      document.querySelector("#source-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        await post("/source", {
          id: `source-${Date.now()}`,
          title: document.querySelector("#source-title").value,
          body: sourceBody.value,
        });
      });
      document.querySelector("#generate").addEventListener("click", async () => post("/generate", {}));
      document.querySelector("#reveal").addEventListener("click", async () => post("/reveal", {}));
      document.querySelector("#next").addEventListener("click", async () => post("/next", {}));
      document.querySelector("#submit").addEventListener("click", async () => {
        await post("/answer", { answer: answer.value, responseTimeMs: 2400 });
      });

      async function post(path, payload) {
        render(await fetchJson(path, { method: "POST", body: JSON.stringify(payload) }));
      }

      async function fetchJson(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: { "content-type": "application/json" },
        });
        if (!response.ok) {
          throw new Error(await response.text());
        }
        return response.json();
      }

      function render(view) {
        document.querySelector("#status").textContent = view.status;
        document.querySelector("#attempts").textContent = String(view.summary.attemptCount);
        document.querySelector("#outcome").textContent = view.summary.lastOutcome ?? "none";

        const current = view.current;
        document.querySelector("#prompt").textContent = current?.prompt ?? "Approve a draft to study.";
        document.querySelector("#activity").textContent = current?.activityKind ?? "no item";
        document.querySelector("#stage").textContent = current?.activityStage ?? "drafting";
        document.querySelector("#expected").textContent = current?.expectedAnswer
          ? `Expected: ${current.expectedAnswer}`
          : "";
        document.querySelector("#solution").textContent = current?.workedSolution
          ? `Worked solution: ${current.workedSolution}`
          : "";
        document.querySelector("#grade").textContent = current?.grade
          ? `${current.grade.verdict} · rating ${current.grade.rating}`
          : "";
        document.querySelector("#reps").textContent = String(current?.reviewState?.reps ?? 0);
        document.querySelector("#state").textContent = String(current?.reviewState?.state ?? "new");

        document.querySelector("#drafts").replaceChildren(
          ...view.drafts.map((draft) => {
            const item = document.createElement("li");
            const title = document.createElement("strong");
            const metadata = document.createTextNode(`${draft.activityKind} · ${draft.activityStage}`);
            const button = document.createElement("button");
            button.type = "button";
            button.textContent = "Approve";
            button.className = "secondary";
            button.addEventListener("click", async () => post("/approve", { draftId: draft.id }));
            title.textContent = draft.prompt;
            item.append(title, metadata);
            if (draft.validationStatus === "accepted") {
              item.append(" ", button);
            }
            return item;
          }),
        );

        document.querySelector("#queue").replaceChildren(
          ...view.queue.map((row) => {
            const item = document.createElement("li");
            const title = document.createElement("strong");
            title.textContent = row.reviewUnitId;
            item.append(title, `${row.activityKind ?? "item"} · reps ${row.reps}`);
            return item;
          }),
        );
      }

      fetchJson("/state").then(render);
    </script>
  </body>
</html>
