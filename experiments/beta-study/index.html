<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Engine Beta Study</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI",
          sans-serif;
        background: #f5f6f2;
        color: #20241f;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f5f6f2;
      }

      main {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 20px;
      }

      .shell {
        width: min(100%, 720px);
        display: grid;
        gap: 20px;
      }

      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        color: #586257;
        font-size: 14px;
      }

      .brand {
        display: grid;
        gap: 3px;
      }

      .brand strong {
        color: #20241f;
        font-size: 15px;
      }

      .status {
        border: 1px solid #b8c5b3;
        border-radius: 999px;
        padding: 6px 10px;
        background: #ffffff;
        color: #24533d;
        font-weight: 750;
        white-space: nowrap;
      }

      .surface {
        display: grid;
        gap: 18px;
        align-content: start;
      }

      .eyebrow {
        margin: 0;
        color: #586257;
        font-size: 14px;
        font-weight: 750;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        line-height: 1.12;
        letter-spacing: 0;
      }

      .lede,
      .hint,
      .reference,
      details {
        color: #455048;
        font-size: 15px;
        line-height: 1.45;
      }

      .lede {
        margin: 0;
        max-width: 620px;
      }

      form,
      .reviewer,
      .approval,
      .failure,
      .empty {
        display: grid;
        gap: 14px;
      }

      label {
        display: block;
        color: #586257;
        font-size: 14px;
        font-weight: 650;
      }

      textarea {
        width: 100%;
        min-height: 148px;
        resize: vertical;
        border: 1px solid #b8c5b3;
        border-radius: 8px;
        padding: 14px;
        background: #ffffff;
        color: #20241f;
        font: inherit;
        line-height: 1.45;
      }

      .reviewer textarea {
        min-height: 132px;
      }

      button {
        min-height: 44px;
        border: 1px solid #24533d;
        border-radius: 8px;
        padding: 0 15px;
        background: #24533d;
        color: #ffffff;
        font: inherit;
        font-weight: 750;
        cursor: pointer;
      }

      button.secondary {
        background: #ffffff;
        color: #24533d;
      }

      button.warn {
        border-color: #8d4d2d;
        background: #ffffff;
        color: #8d4d2d;
      }

      button:disabled {
        border-color: #c8cec5;
        background: #e6e9e3;
        color: #7b847a;
        cursor: not-allowed;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
      }

      .answer,
      .grade,
      .solution,
      .failure {
        overflow-wrap: anywhere;
      }

      .answer {
        color: #24533d;
        font-weight: 700;
      }

      .grade {
        color: #7a4322;
        font-weight: 700;
      }

      .solution {
        color: #455048;
      }

      .approval,
      .failure,
      .empty,
      details {
        border: 1px solid #d9ded5;
        border-radius: 8px;
        background: #ffffff;
        padding: 16px;
      }

      .reference {
        margin: 0;
        border-left: 3px solid #d9b166;
        padding-left: 12px;
      }

      .edit-fields {
        display: grid;
        gap: 10px;
      }

      details {
        font-size: 14px;
      }

      summary {
        cursor: pointer;
        color: #24533d;
        font-weight: 750;
      }

      .diagnostics {
        margin: 12px 0 0;
        padding-left: 18px;
      }

      [hidden] {
        display: none !important;
      }

      @media (max-width: 520px) {
        main {
          display: block;
          padding: 16px;
        }

        .shell {
          min-height: calc(100vh - 32px);
          align-content: center;
        }

        h1 {
          font-size: 29px;
        }

        .actions button {
          flex: 1 1 136px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="shell">
        <header>
          <div class="brand">
            <strong>Memory Engine</strong>
            <span>Modern AI-enhanced SRS</span>
          </div>
          <span class="status" id="status">Loading</span>
        </header>

        <section class="surface">
          <p class="eyebrow" id="eyebrow">Build a memory</p>
          <h1 id="prompt">Paste anything you want to remember.</h1>
          <p class="lede" id="lede">
            The app will turn your source into cited recall practice before anything enters the
            review queue.
          </p>

          <form id="source-form">
            <label for="source-body">Source text</label>
            <textarea
              id="source-body"
              autocomplete="off"
              spellcheck="true"
              placeholder="Paste notes, facts, worked examples, or a paragraph you want to remember."
            ></textarea>
            <div class="actions">
              <button type="submit" id="primary-action">Make practice</button>
            </div>
          </form>

          <section class="failure" id="failure" hidden>
            <strong>Could not make useful practice yet.</strong>
            <p id="failure-copy"></p>
          </section>

          <section class="approval" id="approval" hidden>
            <p class="eyebrow">Check the source</p>
            <p class="reference" id="draft-reference"></p>
            <div class="edit-fields">
              <label for="draft-prompt">Question</label>
              <textarea id="draft-prompt" readonly></textarea>
              <label for="draft-answer">Expected answer</label>
              <textarea id="draft-answer" readonly></textarea>
            </div>
            <div class="actions">
              <button type="button" id="approve">Keep</button>
              <button type="button" class="warn" id="skip">Skip</button>
              <button type="button" class="secondary" id="edit">Edit</button>
              <button type="button" class="secondary" id="save-edit" hidden>Save edit</button>
              <button type="button" class="secondary" id="start-practice" hidden>
                Start practice
              </button>
            </div>
          </section>

          <section class="reviewer" id="reviewer" hidden>
            <label for="answer" id="answer-label">Answer from memory</label>
            <textarea id="answer" autocomplete="off" spellcheck="false"></textarea>
            <div class="answer" id="expected"></div>
            <div class="solution" id="solution"></div>
            <div class="grade" id="grade"></div>
            <div class="actions">
              <button type="button" id="submit">Submit answer</button>
              <button type="button" class="secondary" id="reveal">Show answer</button>
              <button type="button" class="secondary" id="next">Next card</button>
            </div>
          </section>

          <section class="empty" id="empty" hidden>
            <p class="hint" id="empty-copy"></p>
            <div class="actions">
              <button type="button" id="empty-start">Start practice</button>
            </div>
          </section>

          <details id="details" hidden>
            <summary>Session details</summary>
            <ul class="diagnostics" id="diagnostics"></ul>
          </details>
        </section>
      </section>
    </main>
    <script>
      const sourceForm = document.querySelector("#source-form");
      const sourceBody = document.querySelector("#source-body");
      const answer = document.querySelector("#answer");
      const draftPrompt = document.querySelector("#draft-prompt");
      const draftAnswer = document.querySelector("#draft-answer");

      let latestView = null;
      let activeDraftId = null;
      let questionShownAt = Date.now();

      sourceForm.addEventListener("submit", async (event) => {
        event.preventDefault();
        const body = sourceBody.value.trim();
        if (body.length === 0) {
          sourceBody.focus();
          return;
        }
        setBusy("Finding concepts");
        const sourceId = `source-${Date.now()}`;
        const sourceTitle = titleFromBody(body);
        await fetchJson("/source", {
          method: "POST",
          body: JSON.stringify({ id: sourceId, title: sourceTitle, body }),
        });
        render(
          await fetchJson("/generate", {
            method: "POST",
            body: JSON.stringify({}),
          }),
        );
      });

      document.querySelector("#approve").addEventListener("click", async () => {
        if (activeDraftId === null) return;
        render(await post("/approve", { draftId: activeDraftId }));
      });

      document.querySelector("#skip").addEventListener("click", async () => {
        if (activeDraftId === null) return;
        render(await post("/reject", { draftId: activeDraftId, reason: "Skipped by learner" }));
      });

      document.querySelector("#edit").addEventListener("click", () => {
        draftPrompt.readOnly = false;
        draftAnswer.readOnly = false;
        document.querySelector("#save-edit").hidden = false;
        draftPrompt.focus();
      });

      document.querySelector("#save-edit").addEventListener("click", async () => {
        if (activeDraftId === null) return;
        render(
          await post("/draft", {
            draftId: activeDraftId,
            prompt: draftPrompt.value,
            expectedAnswer: draftAnswer.value,
          }),
        );
      });

      document.querySelector("#start-practice").addEventListener("click", async () => {
        answer.value = "";
        render(await post("/next", {}));
      });

      document.querySelector("#empty-start").addEventListener("click", async () => {
        answer.value = "";
        render(await post("/next", {}));
      });

      document.querySelector("#reveal").addEventListener("click", async () => {
        render(await post("/reveal", {}));
      });

      document.querySelector("#next").addEventListener("click", async () => {
        answer.value = "";
        render(await post("/next", {}));
      });

      document.querySelector("#submit").addEventListener("click", async () => {
        const responseTimeMs = Math.max(1, Date.now() - questionShownAt);
        render(await post("/answer", { answer: answer.value, responseTimeMs }));
      });

      answer.addEventListener("input", () => {
        document.querySelector("#submit").disabled = answer.value.trim() === "";
      });

      async function post(path, payload) {
        return fetchJson(path, { method: "POST", body: JSON.stringify(payload) });
      }

      async function fetchJson(path, options = {}) {
        const response = await fetch(path, {
          ...options,
          headers: { "content-type": "application/json" },
        });
        if (!response.ok) {
          throw new Error(await response.text());
        }
        return response.json();
      }

      function setBusy(message) {
        document.querySelector("#status").textContent = message;
        document.querySelector("#primary-action").disabled = true;
        document.querySelector("#primary-action").textContent = "Checking sources";
      }

      function render(view) {
        const previousCurrent = latestView?.current?.reviewUnitId ?? null;
        latestView = view;
        const draft = currentDraft(view);
        activeDraftId = draft?.id ?? null;
        if (view.current?.reviewUnitId !== previousCurrent) {
          questionShownAt = Date.now();
        }

        hideAll();
        document.querySelector("#status").textContent = statusText(view, draft);
        document.querySelector("#eyebrow").textContent = eyebrowText(view, draft);
        document.querySelector("#prompt").textContent = promptText(view, draft);
        document.querySelector("#lede").textContent = ledeText(view, draft);
        document.querySelector("#primary-action").disabled = false;
        document.querySelector("#primary-action").textContent = "Make practice";

        if (view.current) {
          renderStudy(view);
        } else if (draft) {
          renderApproval(view, draft);
        } else if (view.generationFailures.length > 0) {
          renderFailure(view);
        } else if (view.queue.length > 0) {
          renderEmpty(view);
        } else {
          sourceForm.hidden = false;
        }

        renderDiagnostics(view);
      }

      function hideAll() {
        sourceForm.hidden = true;
        document.querySelector("#failure").hidden = true;
        document.querySelector("#approval").hidden = true;
        document.querySelector("#reviewer").hidden = true;
        document.querySelector("#empty").hidden = true;
        document.querySelector("#save-edit").hidden = true;
        document.querySelector("#start-practice").hidden = true;
      }

      function renderApproval(view, draft) {
        document.querySelector("#approval").hidden = false;
        document.querySelector("#draft-reference").textContent =
          draft.referenceText ?? "No source excerpt was recorded.";
        draftPrompt.value = draft.prompt;
        draftPrompt.readOnly = true;
        draftAnswer.value = draft.expectedAnswer;
        draftAnswer.readOnly = true;
        document.querySelector("#start-practice").hidden = view.queue.length === 0;
      }

      function renderStudy(view) {
        const current = view.current;
        if (!current) return;
        document.querySelector("#reviewer").hidden = false;
        document.querySelector("#answer-label").textContent =
          current.activityKind === "exercise" ? "Work it out" : "Answer from memory";
        document.querySelector("#expected").textContent = current.expectedAnswer
          ? `Expected: ${current.expectedAnswer}`
          : "";
        document.querySelector("#solution").textContent = current.workedSolution
          ? `Worked solution: ${current.workedSolution}`
          : "";
        document.querySelector("#grade").textContent = current.grade
          ? `${labelVerdict(current.grade.verdict)}. Rating ${current.grade.rating}.`
          : "";
        document.querySelector("#submit").disabled =
          view.status === "graded" || answer.value.trim() === "";
        document.querySelector("#reveal").disabled =
          view.status === "revealed" || view.status === "graded";
        document.querySelector("#next").disabled = view.status !== "graded";
      }

      function renderFailure(view) {
        document.querySelector("#failure").hidden = false;
        document.querySelector("#failure-copy").textContent = view.generationFailures.join(" ");
        sourceForm.hidden = false;
      }

      function renderEmpty() {
        document.querySelector("#empty").hidden = false;
        document.querySelector("#empty-copy").textContent =
          "You have kept practice ready. Start the next due card when you are ready.";
      }

      function renderDiagnostics(view) {
        const details = document.querySelector("#details");
        const items = [
          `${view.summary.sourceCount} sources`,
          `${view.summary.acceptedDraftCount} accepted drafts`,
          `${view.summary.approvedReviewUnitCount} kept items`,
          `${view.summary.attemptCount} attempts`,
          `${view.summary.generationFailureCount} generation failures`,
        ];
        document.querySelector("#diagnostics").replaceChildren(
          ...items.map((item) => {
            const row = document.createElement("li");
            row.textContent = item;
            return row;
          }),
        );
        details.hidden = view.summary.sourceCount === 0 && view.summary.attemptCount === 0;
      }

      function currentDraft(view) {
        return (
          view.drafts.find((draft) => draft.validationStatus === "accepted" && !draft.approved) ??
          null
        );
      }

      function statusText(view, draft) {
        if (view.current) {
          if (view.status === "graded") return "Saved";
          if (view.status === "revealed") return "Answer shown";
          return "Studying";
        }
        if (draft) return "Review draft";
        if (view.generationFailures.length > 0) return "Needs source";
        if (view.queue.length > 0) return "Ready";
        return "Start here";
      }

      function eyebrowText(view, draft) {
        if (view.current) return view.status === "graded" ? "Review result" : "Active recall";
        if (draft) return "Keep or skip";
        if (view.generationFailures.length > 0) return "Try a clearer source";
        if (view.queue.length > 0) return "Practice is ready";
        return "Build a memory";
      }

      function promptText(view, draft) {
        if (view.current) return view.current.prompt;
        if (draft) return "Does this look worth studying?";
        if (view.generationFailures.length > 0) return "Paste source-backed facts.";
        if (view.queue.length > 0) return "Start retrieval practice.";
        return "Paste anything you want to remember.";
      }

      function ledeText(view, draft) {
        if (view.current && view.status === "graded") {
          return "Your answer was graded and the schedule was updated.";
        }
        if (view.current) return "Answer first. Reveal only if you need to check yourself.";
        if (draft) return "Generated items stay out of review until you keep them.";
        if (view.generationFailures.length > 0) {
          return "Use sentences like Alpha is the first Greek letter. The generator needs evidence it can cite.";
        }
        if (view.queue.length > 0) return "Your kept cards are due now.";
        return "The app will turn your source into cited recall practice before anything enters the review queue.";
      }

      function titleFromBody(body) {
        return body
          .split(/[.!?\n]/)[0]
          .trim()
          .slice(0, 48) || "Pasted notes";
      }

      function labelVerdict(value) {
        if (value === "correct") return "Correct";
        if (value === "close") return "Close";
        if (value === "wrong") return "Needs work";
        if (value === "revealed") return "Revealed";
        return String(value);
      }

      fetchJson("/state").then(render);
    </script>
  </body>
</html>
