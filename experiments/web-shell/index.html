<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Memory Engine Web Shell</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f6f7f4;
        color: #1e2420;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f6f7f4;
      }

      main {
        min-height: 100vh;
        display: grid;
        grid-template-columns: minmax(0, 1fr) 320px;
        gap: 0;
      }

      .study {
        display: grid;
        grid-template-rows: auto minmax(0, 1fr) auto;
        min-height: 100vh;
        padding: 28px;
      }

      .meta,
      .review-state,
      .queue {
        border-bottom: 1px solid #d7ddd4;
      }

      .meta {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 16px;
        padding-bottom: 18px;
        color: #536057;
        font-size: 14px;
      }

      .prompt-area {
        align-self: center;
        max-width: 820px;
        width: 100%;
      }

      h1 {
        margin: 0 0 28px;
        font-size: 40px;
        line-height: 1.12;
        letter-spacing: 0;
        font-weight: 650;
      }

      label {
        display: block;
        margin-bottom: 10px;
        color: #536057;
        font-size: 14px;
        font-weight: 600;
      }

      textarea {
        width: 100%;
        min-height: 132px;
        resize: vertical;
        border: 1px solid #bfc8bd;
        border-radius: 6px;
        padding: 14px 16px;
        background: #ffffff;
        color: #1e2420;
        font: inherit;
        line-height: 1.45;
      }

      .answer {
        min-height: 28px;
        margin-top: 16px;
        color: #2f5d44;
        font-size: 16px;
        font-weight: 600;
      }

      .grade {
        min-height: 28px;
        margin-top: 8px;
        color: #724322;
        font-size: 16px;
        font-weight: 600;
      }

      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        padding-top: 22px;
      }

      button {
        min-height: 42px;
        border: 1px solid #1f4b35;
        border-radius: 6px;
        padding: 0 16px;
        background: #1f4b35;
        color: #ffffff;
        font: inherit;
        font-weight: 650;
        cursor: pointer;
      }

      button.secondary {
        background: #ffffff;
        color: #1f4b35;
      }

      aside {
        min-height: 100vh;
        border-left: 1px solid #d7ddd4;
        background: #ffffff;
        display: grid;
        grid-template-rows: auto 1fr;
      }

      .review-state,
      .queue {
        padding: 24px;
      }

      h2 {
        margin: 0 0 16px;
        font-size: 15px;
        line-height: 1.2;
        letter-spacing: 0;
      }

      dl {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px 16px;
        margin: 0;
        color: #536057;
        font-size: 14px;
      }

      dd {
        margin: 0;
        color: #1e2420;
        font-weight: 650;
      }

      ol {
        display: grid;
        gap: 10px;
        margin: 0;
        padding-left: 18px;
        color: #536057;
        font-size: 14px;
      }

      li span {
        display: block;
        color: #1e2420;
        font-weight: 650;
        overflow-wrap: anywhere;
      }

      @media (max-width: 760px) {
        main {
          grid-template-columns: 1fr;
        }

        .study {
          display: block;
          min-height: auto;
          padding: 20px;
        }

        .prompt-area {
          margin: 28px 0;
        }

        aside {
          min-height: auto;
          border-left: 0;
          border-top: 1px solid #d7ddd4;
        }

        h1 {
          font-size: 30px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <section class="study">
        <div class="meta">
          <strong id="fixture">Memory Engine Web Shell</strong>
          <span id="status">loading</span>
        </div>
        <div class="prompt-area">
          <h1 id="prompt">Loading prompt</h1>
          <label for="answer">Answer</label>
          <textarea id="answer" autocomplete="off" spellcheck="false"></textarea>
          <div class="answer" id="expected"></div>
          <div class="grade" id="grade"></div>
          <div class="actions">
            <button type="button" id="submit">Submit</button>
            <button type="button" class="secondary" id="reveal">Reveal</button>
            <button type="button" class="secondary" id="next">Next</button>
          </div>
        </div>
      </section>
      <aside>
        <section class="review-state">
          <h2>Review State</h2>
          <dl>
            <dt>Reps</dt>
            <dd id="reps">0</dd>
            <dt>State</dt>
            <dd id="state">new</dd>
            <dt>Attempts</dt>
            <dd id="attempts">0</dd>
          </dl>
        </section>
        <section class="queue">
          <h2>Queue</h2>
          <ol id="queue"></ol>
        </section>
      </aside>
    </main>
    <script>
      const answer = document.querySelector('#answer');
      const expected = document.querySelector('#expected');
      const fixture = document.querySelector('#fixture');
      const grade = document.querySelector('#grade');
      const prompt = document.querySelector('#prompt');
      const queue = document.querySelector('#queue');
      const reps = document.querySelector('#reps');
      const state = document.querySelector('#state');
      const status = document.querySelector('#status');
      const attempts = document.querySelector('#attempts');

      async function request(path, init) {
        const response = await fetch(path, init);
        if (!response.ok) {
          throw new Error(await response.text());
        }
        return response.json();
      }

      function render(view) {
        fixture.textContent = view.fixture;
        status.textContent = view.status;
        prompt.textContent = view.current?.prompt ?? 'Queue empty';
        expected.textContent = view.current?.expectedAnswer
          ? `Expected: ${view.current.expectedAnswer}`
          : '';
        grade.textContent = view.current?.grade
          ? `Verdict: ${view.current.grade.verdict}, rating ${view.current.grade.rating}`
          : '';
        reps.textContent = String(view.current?.reviewState?.reps ?? 0);
        state.textContent = String(view.current?.reviewState?.state ?? 'new');
        attempts.textContent = String(view.attempts);
        queue.textContent = '';
        view.queue.forEach((candidate) => {
          const item = document.createElement('li');
          const label = document.createElement('span');
          label.textContent = candidate.reviewUnitId;
          item.appendChild(label);
          item.appendChild(document.createTextNode(`reps ${candidate.reps}`));
          queue.appendChild(item);
        });
      }

      function renderError(error) {
        status.textContent = 'error';
        prompt.textContent = 'Could not load the study shell';
        expected.textContent = error instanceof Error ? error.message : String(error);
      }

      document.querySelector('#submit').addEventListener('click', async () => {
        try {
          render(
            await request('/answer', {
              method: 'POST',
              headers: { 'content-type': 'application/json' },
              body: JSON.stringify({ answer: answer.value, responseTimeMs: 2400 }),
            }),
          );
        } catch (error) {
          renderError(error);
        }
      });

      document.querySelector('#reveal').addEventListener('click', async () => {
        try {
          render(await request('/reveal', { method: 'POST' }));
        } catch (error) {
          renderError(error);
        }
      });

      document.querySelector('#next').addEventListener('click', async () => {
        try {
          answer.value = '';
          render(await request('/next', { method: 'POST' }));
        } catch (error) {
          renderError(error);
        }
      });

      request('/state').then(render).catch(renderError);
    </script>
  </body>
</html>
